name: standalone-smoke

on:
  push:
    branches: [phase-5-production-dashboard]
  pull_request:
    branches: [phase-5-production-dashboard]

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone image
        run: docker build -t insureapi:ci .
      - name: Start standalone API in demo mode
        run: |
          docker run -d --name insureapi-ci -p 3000:3000 -e NODE_ENV=production -e DEMO_MODE=true insureapi:ci
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs insureapi-ci
          exit 1
      - name: Smoke test standalone routes
        run: |
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/ready
          curl --fail --silent http://127.0.0.1:3000/api/dashboard/summary
          curl --fail --silent http://127.0.0.1:3000/ | grep -qi 'InsureAPI'
      - name: Cleanup
        if: always()
        run: docker rm -f insureapi-ci || true
